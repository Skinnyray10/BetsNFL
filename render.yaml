services:
  - type: web
    name: bets-api
    runtime: node
    plan: free
    buildCommand: pnpm install && pnpm --filter @bets/api build
    startCommand: pnpm --filter @bets/api start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: '24'
      - key: RAPIDAPI_KEY
        sync: false
      - key: RAPIDAPI_HOST
        value: nfl-football-api.p.rapidapi.com
      - key: CORS_ORIGIN
        sync: false
      - key: CLAUDE_API_KEY
        sync: false
      - key: CLAUDE_MODEL
        value: claude-sonnet-4-5

  - type: web
    name: bets-web
    runtime: node
    plan: free
    buildCommand: pnpm install && pnpm --filter @bets/web build
    startCommand: pnpm --filter @bets/web start
    envVars:
      - key: NODE_VERSION
        value: '24'
      - key: HOST
        value: '0.0.0.0'
      - key: PUBLIC_API_URL
        sync: false
